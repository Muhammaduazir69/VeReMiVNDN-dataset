#
# VeReMiVNDN-EXE Extension - Multi-Plane Attack Scenarios + MI-IDS
#
# This file is the single entry point for paper-ready evaluation runs.
#
# === FOUR MAIN SCENARIOS (run these in OMNeT++ Qtenv to reproduce the paper) ===
#   EXE_S1_Baseline           - Clean run, no attacks, MI-IDS active (FP rate ~0)
#   EXE_S2_MultiAttackUrban   - JubST (Al-Jubail) urban map, 32 attackers x 8 families
#   EXE_S3_MultiAttackHighway - JubST-Dense map at highway speeds, same 32 mix
#   EXE_S4_AdversarialRobust  - MI-IDS under PGD adversarial sweep (epsilon 0..0.10)
#
# All four scenarios are thin aliases over the canonical building blocks below
# (EXE_Base, EXE_MIIDS_MultiAttack, EXE_MIIDS_AdvSweep). Per-attack scenarios
# (EXE_MIIDS_A1..A8) and the 360-run factorial sweep remain available.
#
# Run with: opp_run -u Cmdenv -f omnetpp.ini -f vremivndn_exe.ini -c <Config>
#

include omnetpp.ini

#
# ---------------------------------------------------------------------------
# Section 0. Master scenarios (paper-ready entry points)
# ---------------------------------------------------------------------------
#

[Config EXE_S1_Baseline]
extends = EXE_MIIDS_Base
description = "S1: Clean JubST baseline, no attacks, MI-IDS active (validates FPR=0)"
sim-time-limit = 600s
warmup-period = 30s
*.numMaliciousVehicles = 0
*.vehicle[*].hasAttackModule = false

[Config EXE_S2_MultiAttackUrban]
extends = EXE_MIIDS_MultiAttack
description = "S2: JubST urban, 32 attackers across all 8 attack families, MI-IDS active"
sim-time-limit = 800s

[Config EXE_S3_MultiAttackHighway]
extends = EXE_MIIDS_MultiAttack
description = "S3: JubST-Dense at highway speeds, same 32-attacker mix, MI-IDS active"
sim-time-limit = 800s
*.manager.launchConfig = xmldoc("../scenarios/sumo/aljubail_dense.launchd.xml")
# Highway-style mobility - bumped speed and longer comm range
*.vehicleSpeedMean = 27.78mps   # ~100 km/h
*.communicationRange = 600m
*.interferenceRange = 1200m

[Config EXE_S4_AdversarialRobust]
extends = EXE_MIIDS_AdvSweep
description = "S4: MI-IDS under PGD adversarial sweep, 6 epsilon points x 3 repetitions"
sim-time-limit = 600s

#
# ---------------------------------------------------------------------------
# Section 1. EXE base profile - 50 ms feature sampling, bursty attack timing
# ---------------------------------------------------------------------------
#
[Config EXE_Base]
extends = BasicVNDN
description = "VeReMiVNDN-EXE base: 50 ms feature sampling, bursty attacker timing"
sim-time-limit = 1000s
warmup-period = 30s

# Feature extractor: denser sampling for the new 110-dim vector
*.vehicle[*].featureExtractor.extractionInterval = 50ms
*.vehicle[*].featureExtractor.timeWindowSize = 5s
*.vehicle[*].featureExtractor.maxHistorySize = 200
*.vehicle[*].featureExtractor.enableRealTimeExtraction = true
*.rsu[*].featureExtractor.extractionInterval = 50ms

# Data collector: switch to per-50ms streaming for ML training
*.vehicle[*].dataCollector.collectionInterval = 50ms
*.vehicle[*].dataCollector.exportInterval = 30s
*.vehicle[*].dataCollector.bufferSize = 4000
*.vehicle[*].dataCollector.datasetName = "vndn_exe_dataset"

# Bursty attack timing - default values; per-attack scenarios override these
# to give each attack a distinct temporal signature (low duty stealth attacks
# are 30/70 on/off, aggressive bursts are 80/20, reactive PHY is 15/15, etc.)
*.numMaliciousVehicles = ${maliciousCount=10,20,30,40,50,60}   # mapped to ratio sweep below
*.vehicle[*].attackBurstOnWindow = 60s     # active window mean
*.vehicle[*].attackBurstOffWindow = 40s    # silent window mean
*.vehicle[*].attackBurstJitter = 15s       # uniform jitter on each window

#
# ---------------------------------------------------------------------------
# Section 2. Eight EXE multi-plane attack scenarios, each with distinct
#            network parameters (attacker count, intensity, duty cycle,
#            target prefix, attack-specific JSON config). The eight cover
#            five MI-IDS detection planes (Data, Cache, Trust, Forwarding,
#            PHY), with intra-plane variants on Data (Poisoning, Replay)
#            and Cache (Pollution, Privacy Leakage) plus a cross-layer
#            adversarial attack (ML Evasion) that targets the IDS itself.
# ---------------------------------------------------------------------------
#

# EXE Attack 1 - Content Poisoning (Data plane, signature/payload-tampering)
# Aggressive, /traffic-targeted, bursty.
[Config EXE_A1_ContentPoisoning]
extends = EXE_Base
description = "EXE-A1: Content Poisoning (Data plane), aggressive bursty"
*.numMaliciousVehicles = 10
*.vehicle[0..9].hasAttackModule = true
*.vehicle[0..9].attackType = "ContentPoisoning"
*.vehicle[0..9].attackModuleType = "veremivndn.attacks.data.ContentPoisoning"
*.vehicle[0..9].attackStartTime = 60s
*.vehicle[0..9].attackDuration = 800s
*.vehicle[0..9].attackIntensity = 0.70
*.vehicle[0..9].attackBurstOnWindow = 60s
*.vehicle[0..9].attackBurstOffWindow = 40s
*.vehicle[0..9].attackParameters = "{\"targetPrefix\":\"/traffic\", \"poisonProbability\":0.7, \"mode\":\"fake\", \"interceptData\":true, \"fakeSignatures\":true}"

# EXE Attack 2 - Cache Pollution (Cache plane, write-flooding)
# Low-duty-cycle high-rate request floods to push popular content out of CS.
[Config EXE_A2_CachePollution]
extends = EXE_Base
description = "EXE-A2: Cache Pollution (Cache plane), high-rate unpopular content flood"
*.numMaliciousVehicles = 8
*.vehicle[0..7].hasAttackModule = true
*.vehicle[0..7].attackType = "CachePollution"
*.vehicle[0..7].attackModuleType = "veremivndn.attacks.caching.CachePollution"
*.vehicle[0..7].attackStartTime = 90s
*.vehicle[0..7].attackDuration = 750s
*.vehicle[0..7].attackIntensity = 0.65
*.vehicle[0..7].attackBurstOnWindow = 45s
*.vehicle[0..7].attackBurstOffWindow = 55s
*.vehicle[0..7].attackParameters = "{\"unpopularContent\":true, \"requestRate\":150, \"contentPoolSize\":4000, \"targetPrefix\":\"/content\"}"

# EXE Attack 3 - Cache Privacy Leakage (Cache plane, side-channel)
# Stealthy probe-based timing attack with low duty cycle.
[Config EXE_A3_CachePrivacyLeakage]
extends = EXE_Base
description = "EXE-A3: Cache Privacy Leakage (Cache plane), stealthy probing"
*.numMaliciousVehicles = 6
*.vehicle[0..5].hasAttackModule = true
*.vehicle[0..5].attackType = "CachePrivacyLeakage"
*.vehicle[0..5].attackModuleType = "veremivndn.attacks.caching.CachePrivacyLeakage"
*.vehicle[0..5].attackStartTime = 120s
*.vehicle[0..5].attackDuration = 720s
*.vehicle[0..5].attackIntensity = 0.55
*.vehicle[0..5].attackBurstOnWindow = 30s
*.vehicle[0..5].attackBurstOffWindow = 70s
*.vehicle[0..5].attackParameters = "{\"shareCache\":true, \"leakRequests\":true, \"collectHistory\":true, \"probeInterval\":0.05, \"targetPrefix\":\"/location\"}"

# EXE Attack 4 - Sybil Amplification (Trust plane, identity)
# 12 attackers spawning 12 sybil IDs each, coordinated request bursts.
[Config EXE_A4_SybilAmplification]
extends = EXE_Base
description = "EXE-A4: Sybil Amplification (Trust plane), high-amplification bursts"
*.numMaliciousVehicles = 12
*.vehicle[0..11].hasAttackModule = true
*.vehicle[0..11].attackType = "SybilAmplification"
*.vehicle[0..11].attackModuleType = "veremivndn.attacks.trust.SybilAmplification"
*.vehicle[0..11].attackStartTime = 75s
*.vehicle[0..11].attackDuration = 780s
*.vehicle[0..11].attackIntensity = 0.80
*.vehicle[0..11].attackBurstOnWindow = 80s
*.vehicle[0..11].attackBurstOffWindow = 20s
*.vehicle[0..11].attackParameters = "{\"numSybilIds\":12, \"coordinatedRequests\":true, \"spoofLocation\":true, \"targetContent\":\"/traffic\"}"

# EXE Attack 5 - Selective Forwarding (Forwarding-behavior plane, gray-hole)
# Drops a fraction of /safety packets while honestly forwarding others.
[Config EXE_A5_SelectiveForwarding]
extends = EXE_Base
description = "EXE-A5: Selective Forwarding (Gray Hole), safety-packet drop"
*.numMaliciousVehicles = 9
*.vehicle[0..8].hasAttackModule = true
*.vehicle[0..8].attackType = "SelectiveForwarding"
*.vehicle[0..8].attackModuleType = "veremivndn.attacks.crosslayer.SelectiveForwarding"
*.vehicle[0..8].attackStartTime = 60s
*.vehicle[0..8].attackDuration = 800s
*.vehicle[0..8].attackIntensity = 0.75
*.vehicle[0..8].attackBurstOnWindow = 60s
*.vehicle[0..8].attackBurstOffWindow = 40s
*.vehicle[0..8].attackParameters = "{\"dropProbability\":0.6, \"targetType\":\"safety\", \"selectiveDelay\":true, \"delayAmount\":0.4, \"targetPrefix\":\"/safety\", \"dropInterest\":true, \"dropData\":true, \"criteria\":\"BY_PREFIX\"}"

# EXE Attack 6 - Radio Jamming (PHY plane, reactive)
# Short reactive jam bursts on channel 178; high power, narrow on/off cycle.
[Config EXE_A6_RadioJamming]
extends = EXE_Base
description = "EXE-A6: Radio Jamming (PHY plane), reactive high-power"
*.numMaliciousVehicles = 5
*.vehicle[0..4].hasAttackModule = true
*.vehicle[0..4].attackType = "RadioJamming"
*.vehicle[0..4].attackModuleType = "veremivndn.attacks.crosslayer.RadioJamming"
*.vehicle[0..4].attackStartTime = 45s
*.vehicle[0..4].attackDuration = 850s
*.vehicle[0..4].attackIntensity = 0.85
*.vehicle[0..4].attackBurstOnWindow = 15s
*.vehicle[0..4].attackBurstOffWindow = 15s
*.vehicle[0..4].attackParameters = "{\"jammingPower\":28, \"dutyCycle\":0.6, \"targetChannel\":178, \"jammingType\":\"REACTIVE\", \"range\":250.0}"

# EXE Attack 7 - Replay Attack (Data plane, freshness)
# Captures legitimate Data and replays after expiry; forces detection on
# freshness drift instead of signature failure.
[Config EXE_A7_ReplayAttack]
extends = EXE_Base
description = "EXE-A7: Replay Attack (Data plane), stale-Data injection"
*.numMaliciousVehicles = 7
*.vehicle[0..6].hasAttackModule = true
*.vehicle[0..6].attackType = "ReplayAttack"
*.vehicle[0..6].attackModuleType = "veremivndn.attacks.data.ReplayAttack"
*.vehicle[0..6].attackStartTime = 100s
*.vehicle[0..6].attackDuration = 700s
*.vehicle[0..6].attackIntensity = 0.50
*.vehicle[0..6].attackBurstOnWindow = 50s
*.vehicle[0..6].attackBurstOffWindow = 50s
*.vehicle[0..6].attackParameters = "{\"replayWindow\":10, \"freshnessThreshold\":2, \"targetPrefix\":\"/info\", \"captureRate\":0.4, \"replayProbability\":0.6}"

# EXE Attack 8 - ML Evasion (Cross-layer adversarial)
# Gradient-based feature perturbation that targets the IDS detector itself,
# the strongest adversarial threat in the EXE benchmark.
[Config EXE_A8_MLEvasion]
extends = EXE_Base
description = "EXE-A8: ML Evasion (Cross-layer adversarial), PGD-style feature perturbation"
*.numMaliciousVehicles = 4
*.vehicle[0..3].hasAttackModule = true
*.vehicle[0..3].attackType = "MLEvasion"
*.vehicle[0..3].attackModuleType = "veremivndn.attacks.crosslayer.MLEvasion"
*.vehicle[0..3].attackStartTime = 80s
*.vehicle[0..3].attackDuration = 800s
*.vehicle[0..3].attackIntensity = 0.90
*.vehicle[0..3].attackBurstOnWindow = 35s
*.vehicle[0..3].attackBurstOffWindow = 65s
*.vehicle[0..3].attackParameters = "{\"evasionEpsilon\":0.05, \"gradMethod\":\"PGD\", \"perturbationDim\":110, \"iterations\":10, \"targetClassifier\":\"BiLSTM\"}"

#
# ---------------------------------------------------------------------------
# Section 3. Malicious-ratio sweep: 5%, 10%, 15%, 20%, 25%, 30%
# Combine with attack scenarios via -c EXE_<attack>_Sweep
# ---------------------------------------------------------------------------
#
[Config EXE_MaliciousRatio_Sweep]
description = "Malicious-ratio sweep 5% to 30% in 5% steps; combine with EXE_A* configs"
*.maliciousRatioPercent = ${ratio=5,10,15,20,25,30}
seed-set = ${runnumber}
repeat = 5     # 5 independent seeds per (attack x ratio) cell

[Config EXE_A1_Sweep]
extends = EXE_A1_ContentPoisoning, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Content Poisoning across 5%-30% malicious ratios"

[Config EXE_A2_Sweep]
extends = EXE_A2_CachePollution, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Cache Pollution across 5%-30% malicious ratios"

[Config EXE_A3_Sweep]
extends = EXE_A3_CachePrivacyLeakage, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Cache Privacy Leakage across 5%-30% malicious ratios"

[Config EXE_A4_Sweep]
extends = EXE_A4_SybilAmplification, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Sybil Amplification across 5%-30% malicious ratios"

[Config EXE_A5_Sweep]
extends = EXE_A5_SelectiveForwarding, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Selective Forwarding across 5%-30% malicious ratios"

[Config EXE_A6_Sweep]
extends = EXE_A6_RadioJamming, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Radio Jamming across 5%-30% malicious ratios"

[Config EXE_A7_Sweep]
extends = EXE_A7_ReplayAttack, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: Replay Attack across 5%-30% malicious ratios"

[Config EXE_A8_Sweep]
extends = EXE_A8_MLEvasion, EXE_MaliciousRatio_Sweep
description = "EXE Sweep: ML Evasion across 5%-30% malicious ratios"

#
# ---------------------------------------------------------------------------
# Section 4. Second SUMO map - JubST-Dense (denser city sub-graph)
# ---------------------------------------------------------------------------
#
[Config EXE_JubSTDense_Map]
description = "JubST-Dense: denser SUMO sub-graph for geographic generalization tests"
*.manager.launchConfig = xmldoc("../scenarios/sumo/aljubail_dense.launchd.xml")
*.playgroundSizeX = 8000m
*.playgroundSizeY = 8000m
*.playgroundSizeZ = 50m

# RSU layout for the dense map - tighter Pentagon
*.rsu[0].mobility.x = 1500
*.rsu[0].mobility.y = 1500
*.rsu[1].mobility.x = 6500
*.rsu[1].mobility.y = 1500
*.rsu[2].mobility.x = 4000
*.rsu[2].mobility.y = 4000
*.rsu[3].mobility.x = 1500
*.rsu[3].mobility.y = 6500
*.rsu[4].mobility.x = 6500
*.rsu[4].mobility.y = 6500
*.rsu[*].producedItemsPerSecond = 12   # higher producer rate for cache-plane stress

[Config EXE_A1_Sweep_Dense]
extends = EXE_A1_Sweep, EXE_JubSTDense_Map
[Config EXE_A2_Sweep_Dense]
extends = EXE_A2_Sweep, EXE_JubSTDense_Map
[Config EXE_A3_Sweep_Dense]
extends = EXE_A3_Sweep, EXE_JubSTDense_Map
[Config EXE_A4_Sweep_Dense]
extends = EXE_A4_Sweep, EXE_JubSTDense_Map
[Config EXE_A5_Sweep_Dense]
extends = EXE_A5_Sweep, EXE_JubSTDense_Map
[Config EXE_A6_Sweep_Dense]
extends = EXE_A6_Sweep, EXE_JubSTDense_Map
[Config EXE_A7_Sweep_Dense]
extends = EXE_A7_Sweep, EXE_JubSTDense_Map
[Config EXE_A8_Sweep_Dense]
extends = EXE_A8_Sweep, EXE_JubSTDense_Map

#
# ---------------------------------------------------------------------------
# Section 5. MI-IDS evaluation scenarios
# Wires the MI-IDS module into vehicles + RSUs and turns on adversarial-aware
# inference. Use these for reporting the headline numbers in the paper.
# ---------------------------------------------------------------------------
#
[Config EXE_MIIDS_Base]
extends = EXE_Base
description = "EXE MI-IDS base: enable Multilayer Intelligent IDS at all RSUs and vehicles"
# Per-host MI-IDS instances. Each host classifies itself; aggregate F1
# across hosts gives the fleet-level detection metric reported in the paper.
*.rsu[*].hasMIIDSModule = true
*.vehicle[*].hasMIIDSModule = true
**.miids.fusionThreshold = 0.55
**.miids.trustQuarantineWindow = 10s
**.miids.trustDecayAlpha = 0.4
**.miids.trustRecoveryBeta = 0.05
**.miids.detectorReliabilityData = 0.92
**.miids.detectorReliabilityCache = 0.88
**.miids.detectorReliabilityTrust = 0.86
**.miids.detectorReliabilityForwarding = 0.90
**.miids.detectorReliabilityPHY = 0.94
**.miids.adversarialEpsilon = 0.05
# Clean inference on the operational path. enableAdversarialInference makes
# every tick solve an L_inf inner maximisation against the node's own
# detector, i.e. it scores the worst-case evaded input instead of the observed
# one. That is a robustness probe, not a deployment mode: with it on, the
# detector is handed inputs constructed to look benign, so it reports no
# detections at all, and the PGD iterations dominate the run time. Adversarial
# robustness is measured offline in scripts/miids/train_eval_miids.py, which
# sweeps FGSM, PGD and Carlini-Wagner over the same detectors.
**.miids.enableAdversarialInference = false
**.miids.kMax = 0.85   # reject fusion result if conflict >= kMax
# Tick rate kept at 100ms to keep wall-clock manageable across large fleets;
# tighter cadence is available via *.vehicle[*].miids.tickInterval = 50ms.
**.miids.tickInterval = 100ms
# TorchScript detectors for the five planes. These are produced by
#   python3 scripts/miids/train_eval_miids.py --export-models models/miids
# from the exported feature capture, so the detector that runs inside the
# simulator is the same architecture, trained the same way, as the one measured
# offline. Leaving a path empty routes that plane through an untrained
# analytical fallback that flags nothing, so the paths must be set for any run
# whose detection results are reported.
**.miids.modelPathData       = "../../models/miids/data.pt"
**.miids.modelPathCache      = "../../models/miids/cache.pt"
**.miids.modelPathTrust      = "../../models/miids/trust.pt"
**.miids.modelPathForwarding = "../../models/miids/forwarding.pt"
**.miids.modelPathPHY        = "../../models/miids/phy.pt"

[Config EXE_MIIDS_MultiAttack]
extends = EXE_MIIDS_Base
description = "EXE MI-IDS evaluated against all 8 multi-plane attacks simultaneously"
# 4 attackers per attack family x 8 = 32 malicious vehicles, distributed
# across vehicle indices [0..31] so each attack family is exercised in
# parallel. Network parameters intentionally preserve each attack's
# preferred timing so the multi-attack scenario reflects a realistic
# concurrent-threat environment, not a synchronized stress test.
*.numMaliciousVehicles = 32
# Multi-attack timing: every family runs for the bulk of the sim window.
# Without explicit start/duration the attack modules fall back to NED
# default duration=0s and never fire, which is what caused S2 to ship
# zero attack events in the dataset.
*.vehicle[0..31].attackStartTime = 60s
*.vehicle[0..31].attackDuration  = 700s
*.vehicle[0..3].hasAttackModule = true
*.vehicle[0..3].attackType = "ContentPoisoning"
*.vehicle[0..3].attackModuleType = "veremivndn.attacks.data.ContentPoisoning"
*.vehicle[0..3].attackIntensity = 0.70
*.vehicle[0..3].attackBurstOnWindow = 60s
*.vehicle[0..3].attackBurstOffWindow = 40s
*.vehicle[0..3].attackParameters = "{\"targetPrefix\":\"/traffic\", \"poisonProbability\":0.7, \"fakeSignatures\":true}"

*.vehicle[4..7].hasAttackModule = true
*.vehicle[4..7].attackType = "CachePollution"
*.vehicle[4..7].attackModuleType = "veremivndn.attacks.caching.CachePollution"
*.vehicle[4..7].attackIntensity = 0.65
*.vehicle[4..7].attackBurstOnWindow = 45s
*.vehicle[4..7].attackBurstOffWindow = 55s
*.vehicle[4..7].attackParameters = "{\"unpopularContent\":true, \"requestRate\":150, \"contentPoolSize\":4000, \"targetPrefix\":\"/content\"}"

*.vehicle[8..11].hasAttackModule = true
*.vehicle[8..11].attackType = "CachePrivacyLeakage"
*.vehicle[8..11].attackModuleType = "veremivndn.attacks.caching.CachePrivacyLeakage"
*.vehicle[8..11].attackIntensity = 0.55
*.vehicle[8..11].attackBurstOnWindow = 30s
*.vehicle[8..11].attackBurstOffWindow = 70s
*.vehicle[8..11].attackParameters = "{\"shareCache\":true, \"leakRequests\":true, \"probeInterval\":0.05, \"targetPrefix\":\"/location\"}"

*.vehicle[12..15].hasAttackModule = true
*.vehicle[12..15].attackType = "SybilAmplification"
*.vehicle[12..15].attackModuleType = "veremivndn.attacks.trust.SybilAmplification"
*.vehicle[12..15].attackIntensity = 0.80
*.vehicle[12..15].attackBurstOnWindow = 80s
*.vehicle[12..15].attackBurstOffWindow = 20s
*.vehicle[12..15].attackParameters = "{\"numSybilIds\":12, \"coordinatedRequests\":true, \"spoofLocation\":true, \"targetContent\":\"/traffic\"}"

*.vehicle[16..19].hasAttackModule = true
*.vehicle[16..19].attackType = "SelectiveForwarding"
*.vehicle[16..19].attackModuleType = "veremivndn.attacks.crosslayer.SelectiveForwarding"
*.vehicle[16..19].attackIntensity = 0.75
*.vehicle[16..19].attackBurstOnWindow = 60s
*.vehicle[16..19].attackBurstOffWindow = 40s
*.vehicle[16..19].attackParameters = "{\"dropProbability\":0.6, \"targetPrefix\":\"/safety\", \"dropInterest\":true, \"dropData\":true}"

*.vehicle[20..23].hasAttackModule = true
*.vehicle[20..23].attackType = "RadioJamming"
*.vehicle[20..23].attackModuleType = "veremivndn.attacks.crosslayer.RadioJamming"
*.vehicle[20..23].attackIntensity = 0.85
*.vehicle[20..23].attackBurstOnWindow = 15s
*.vehicle[20..23].attackBurstOffWindow = 15s
*.vehicle[20..23].attackParameters = "{\"jammingPower\":28, \"dutyCycle\":0.6, \"targetChannel\":178, \"jammingType\":\"REACTIVE\"}"

*.vehicle[24..27].hasAttackModule = true
*.vehicle[24..27].attackType = "ReplayAttack"
*.vehicle[24..27].attackModuleType = "veremivndn.attacks.data.ReplayAttack"
*.vehicle[24..27].attackIntensity = 0.50
*.vehicle[24..27].attackBurstOnWindow = 50s
*.vehicle[24..27].attackBurstOffWindow = 50s
*.vehicle[24..27].attackParameters = "{\"replayWindow\":10, \"freshnessThreshold\":2, \"targetPrefix\":\"/info\", \"replayProbability\":0.6}"

*.vehicle[28..31].hasAttackModule = true
*.vehicle[28..31].attackType = "MLEvasion"
*.vehicle[28..31].attackModuleType = "veremivndn.attacks.crosslayer.MLEvasion"
*.vehicle[28..31].attackIntensity = 0.90
*.vehicle[28..31].attackBurstOnWindow = 35s
*.vehicle[28..31].attackBurstOffWindow = 65s
*.vehicle[28..31].attackParameters = "{\"evasionEpsilon\":0.05, \"gradMethod\":\"PGD\", \"perturbationDim\":110, \"iterations\":10}"

*.vehicle[*].attackStartTime = 60s
*.vehicle[*].attackDuration = 800s

#
# Baseline IDS configurations for the comparison reported in the paper
#
[Config EXE_Baseline_ThresholdIDS]
extends = EXE_MIIDS_MultiAttack
description = "Baseline: published threshold IDS from VeReMiVNDN (Aldahlan 2026)"
*.rsu[*].hasMIIDSModule = false
*.vehicle[*].hasMIIDSModule = false
*.rsu[*].hasIDSModule = true
*.vehicle[*].hasIDSModule = true
*.rsu[*].idsDetectionMethod = "Hybrid"
*.rsu[*].idsDetectionThreshold = 0.7
# Use the 87-dim, 100ms feature configuration from the published paper
*.vehicle[*].featureExtractor.extractionInterval = 100ms
*.vehicle[*].featureExtractor.timeWindowSize = 1s
*.vehicle[*].dataCollector.collectionInterval = 100ms

[Config EXE_Baseline_SingleVectorBiLSTM]
extends = EXE_MIIDS_MultiAttack
description = "Baseline: single-vector BiLSTM (no DST fusion, no per-plane decomposition)"
**.miids.fusionMode = "linear"     # disable DST, fall back to weighted sum
**.miids.singleVectorMode = true
**.miids.enableAdversarialInference = false

[Config EXE_Baseline_MajorityVote]
extends = EXE_MIIDS_MultiAttack
description = "Baseline: majority-vote ensemble across the 5 detectors (no DST)"
**.miids.fusionMode = "majority"
**.miids.enableAdversarialInference = false

#
# ---------------------------------------------------------------------------
# Section 5b. MI-IDS evaluated against each attack family in isolation
# ---------------------------------------------------------------------------
#
[Config EXE_MIIDS_A1]
extends = EXE_A1_ContentPoisoning, EXE_MIIDS_Base
description = "MI-IDS vs Content Poisoning (Data plane)"

[Config EXE_MIIDS_A2]
extends = EXE_A2_CachePollution, EXE_MIIDS_Base
description = "MI-IDS vs Cache Pollution (Cache plane)"

[Config EXE_MIIDS_A3]
extends = EXE_A3_CachePrivacyLeakage, EXE_MIIDS_Base
description = "MI-IDS vs Cache Privacy Leakage (Cache plane, side-channel)"

[Config EXE_MIIDS_A4]
extends = EXE_A4_SybilAmplification, EXE_MIIDS_Base
description = "MI-IDS vs Sybil Amplification (Trust plane)"

[Config EXE_MIIDS_A5]
extends = EXE_A5_SelectiveForwarding, EXE_MIIDS_Base
description = "MI-IDS vs Selective Forwarding (Forwarding-behavior plane)"

[Config EXE_MIIDS_A6]
extends = EXE_A6_RadioJamming, EXE_MIIDS_Base
description = "MI-IDS vs Radio Jamming (PHY plane)"

[Config EXE_MIIDS_A7]
extends = EXE_A7_ReplayAttack, EXE_MIIDS_Base
description = "MI-IDS vs Replay Attack (Data plane, freshness)"

[Config EXE_MIIDS_A8]
extends = EXE_A8_MLEvasion, EXE_MIIDS_Base
description = "MI-IDS vs ML Evasion (Cross-layer adversarial)"

#
# ---------------------------------------------------------------------------
# Section 6. Adversarial robustness sweep (PGD epsilon)
# ---------------------------------------------------------------------------
#
[Config EXE_MIIDS_AdvSweep]
extends = EXE_MIIDS_MultiAttack
description = "MI-IDS adversarial robustness sweep over PGD epsilon budget"
**.miids.adversarialEpsilon = ${eps=0.0,0.01,0.03,0.05,0.07,0.10}
**.miids.adversarialMethod = "PGD"
**.miids.pgdSteps = 10
repeat = 3

#
# ---------------------------------------------------------------------------
# Section 7. Honest measurement campaign (VeReMiVNDN-EXE v2)
# ---------------------------------------------------------------------------
#
# These configs replace the earlier MI-IDS evaluation, in which detector inputs
# were drawn from the attacker label rather than from observed traffic. Here
# every MI-IDS decision is a function of packets the observer actually received,
# its own Content Store outcomes, and its own 802.11p MAC counters.
#
# Monitors are the five static RSUs. Vehicles are created and destroyed by TraCI
# during the run, so a vehicle-hosted monitor only writes results if it happens
# to still be in the scenario at the end; RSU-hosted monitors are present for
# the whole run and give a complete, unbiased decision set.
#
# CAP_* configs generate labelled per-plane feature CSVs for offline training.
# EVAL_* configs replay the same scenarios with trained detectors loaded.
#

[Config EXE_Capture_Base]
extends = EXE_MIIDS_Base
description = "Feature-capture base: realistic content model, plane CSV export"
sim-time-limit = 400s
warmup-period = 30s
*.numMaliciousVehicles = 10
# Concurrent fleet size. With frame delivery correctly limited to the
# communication range, a 50-vehicle fleet spread over a 15 km x 16 km map has
# essentially no neighbours; the published configuration only appeared
# connected because the medium delivered every frame network-wide.
*.numVehicles = 300

# --- Infrastructure coverage ---------------------------------------------
# A 6 x 5 RSU grid over the 15 km x 16 km playground, i.e. one RSU every
# ~2.1 km x ~2.7 km, which is the order of spacing used on instrumented
# corridors. With the published five-RSU pentagon and a correctly range-limited
# medium, a consumer essentially never had a producer within radio reach.
*.numRSU = 30
*.rsuGridCols = 6
*.rsuGridRows = 5

# 802.11p reach. 500 m is a conservative urban figure; 800 m is within the
# range reported for 5.9 GHz DSRC on open corridors and is what the JubST
# industrial road network resembles.
*.communicationRange = 800m
*.interferenceRange = 1600m

# --- Content model -------------------------------------------------------
# A shared Zipf catalogue plus a minority of one-off safety events. Without
# repeat demand the Content Store can never hit, which would leave the caching
# plane (pollution, timing side channel) with nothing to perturb.
*.vehicle[*].catalogSize        = 200
*.vehicle[*].catalogZipfAlpha   = 0.9
*.vehicle[*].uniqueNameFraction = 0.25
*.vehicle[*].maxRelayHops       = 3

# RSUs must serve every catalogue prefix, including the /content namespace
# that the Cache Pollution attacker targets.
*.rsu[*].producedPrefixes = "/traffic,/safety,/info,/content"

# --- Node roles ----------------------------------------------------------
# 30% of vehicles produce content and 40% relay. A pure-consumer fleet, as
# used in the published configuration, makes Content Poisoning, Replay and
# Selective Forwarding unobservable by construction.
*.vehicle[*].isContentProducer = (index % 10) < 3
*.vehicle[*].isForwarder       = (index % 10) >= 3 && (index % 10) < 7

# Both RSUs and vehicles monitor. RSUs see the Interest side of the network
# (cache, trust and forwarding evidence); vehicles are the ones that receive
# Data, so data-plane evidence (poisoned payloads, replayed content) is only
# visible from a vehicle vantage point. Restricting the monitor set to RSUs
# would make Content Poisoning and Replay undetectable by construction.
*.rsu[*].hasMIIDSModule = true
*.vehicle[*].hasMIIDSModule = true

# Labelled per-plane export, one file per observer. Rows are flushed as they
# are written, so monitors on vehicles that leave the scenario mid-run still
# contribute their observations.
*.rsu[*].featureExtractor.planeFeatureCsv = "planecsv/plane.csv"
*.rsu[*].featureExtractor.extractionInterval = 500ms
*.rsu[*].featureExtractor.interactionGraphWindow = 2s
# Every fifth vehicle exports its observations. That keeps the training set
# large without writing the same neighbourhood from dozens of near-identical
# vantage points. All vehicles still run MI-IDS and contribute decisions.
# Exporters must not coincide with the attacker set (index % 5 == 0): an
# observer never records itself as a subject, so if the two sets were identical
# no monitor would ever write a row about an attacker.
*.vehicle[*].featureExtractor.planeFeatureCsv = (parentIndex() % 5 == 2) ? "planecsv/plane.csv" : ""
*.vehicle[*].featureExtractor.extractionInterval = 500ms
*.vehicle[*].featureExtractor.interactionGraphWindow = 2s

# Vector recording is the dominant cost at this scale and nothing in the
# capture pipeline reads it back, so it is switched off here.
**.vector-recording = false
**.scalar-recording = true

[Config CAP_Baseline]
extends = EXE_Capture_Base
description = "Capture: clean baseline, no attackers (benign feature distribution)"
*.numMaliciousVehicles = 0
*.vehicle[*].hasAttackModule = false

#
# Attackers are assigned by index modulo rather than by a fixed low index
# range. Vehicles are created and destroyed by TraCI as they traverse the
# scenario, so vehicle[0..k] are the earliest arrivals and have usually left
# before an attack window that opens at t=60s. A modulo assignment keeps the
# malicious fraction constant for the whole run, which is also what the
# malicious-ratio sweep in the paper assumes.
#
# Every attack starts just after warm-up and runs to the end of the scenario,
# so that each captured window contains active adversaries.
#

[Config CAP_AttackBase]
extends = EXE_Capture_Base
description = "Shared attacker layout for the per-attack capture configs"
*.vehicle[*].hasAttackModule = (index % 5 == 0)
*.vehicle[*].attackStartTime = 35s
*.vehicle[*].attackDuration  = 3600s

[Config CAP_A1]
extends = CAP_AttackBase
description = "Capture: Content Poisoning (data plane)"
*.vehicle[*].attackType = "ContentPoisoning"
*.vehicle[*].attackModuleType = "veremivndn.attacks.data.ContentPoisoning"
*.vehicle[*].attackIntensity = 0.70
*.vehicle[*].attackBurstOnWindow = 60s
*.vehicle[*].attackBurstOffWindow = 40s
*.vehicle[*].attackParameters = "{\"targetPrefix\":\"/traffic\", \"poisonProbability\":0.7, \"fakeSignatures\":true}"
# A poisoning attacker must be able to serve content before it can poison it.
*.vehicle[*].isContentProducer = (index % 5 == 0) || (index % 10) < 3

[Config CAP_A2]
extends = CAP_AttackBase
description = "Capture: Cache Pollution (caching plane)"
*.vehicle[*].attackType = "CachePollution"
*.vehicle[*].attackModuleType = "veremivndn.attacks.caching.CachePollution"
*.vehicle[*].attackIntensity = 0.65
*.vehicle[*].attackBurstOnWindow = 45s
*.vehicle[*].attackBurstOffWindow = 55s
# 20 Interests/s per attacker. Benign vehicles request at roughly 0.5/s, so
# this is a 40-fold flood and unambiguously an attack, while remaining within
# what a single 802.11p radio could actually sustain alongside the rest of the
# traffic. The 150/s figure used previously exceeded the aggregate channel
# capacity by a wide margin and made the scenario intractable to simulate.
*.vehicle[*].attackParameters = "{\"requestRate\":20, \"unpopularPoolSize\":4000, \"targetPrefix\":\"/content\"}"

[Config CAP_A3]
extends = CAP_AttackBase
description = "Capture: Cache Privacy Leakage (caching plane, side-channel)"
*.vehicle[*].attackType = "CachePrivacyLeakage"
*.vehicle[*].attackModuleType = "veremivndn.attacks.caching.CachePrivacyLeakage"
*.vehicle[*].attackIntensity = 0.55
*.vehicle[*].attackBurstOnWindow = 30s
*.vehicle[*].attackBurstOffWindow = 70s
# 250 ms between probes. The manuscript describes this adversary as a stealthy,
# low-duty-cycle prober, and a 50 ms cadence contradicts that: it is 40 times
# the benign request rate and would be the most conspicuous traffic on the
# channel. At 250 ms the prober is still eight times more active than a benign
# consumer, which is what the cache-timing side channel requires, while
# remaining the quiet adversary the threat model describes.
*.vehicle[*].attackParameters = "{\"shareCache\":true, \"leakRequests\":true, \"collectHistory\":true, \"probeInterval\":0.25, \"targetPrefix\":\"/location\"}"

[Config CAP_A4]
extends = CAP_AttackBase
description = "Capture: Sybil Amplification (trust plane)"
*.vehicle[*].attackType = "SybilAmplification"
*.vehicle[*].attackModuleType = "veremivndn.attacks.trust.SybilAmplification"
*.vehicle[*].attackIntensity = 0.80
*.vehicle[*].attackBurstOnWindow = 80s
*.vehicle[*].attackBurstOffWindow = 20s
*.vehicle[*].attackParameters = "{\"numSybilIds\":12, \"coordinatedRequests\":true, \"spoofLocation\":true, \"targetContent\":\"/traffic\"}"

[Config CAP_A5]
extends = CAP_AttackBase
description = "Capture: Selective Forwarding (forwarding-behaviour plane)"
*.vehicle[*].attackType = "SelectiveForwarding"
*.vehicle[*].attackModuleType = "veremivndn.attacks.crosslayer.SelectiveForwarding"
*.vehicle[*].attackIntensity = 0.75
*.vehicle[*].attackBurstOnWindow = 60s
*.vehicle[*].attackBurstOffWindow = 40s
*.vehicle[*].attackParameters = "{\"dropProbability\":0.6, \"targetType\":\"safety\", \"selectiveDelay\":true, \"delayAmount\":0.4, \"targetPrefix\":\"/safety\", \"dropInterest\":true, \"dropData\":true, \"criteria\":\"BY_PREFIX\"}"
# A gray hole must sit on a forwarding path to have anything to drop.
*.vehicle[*].isForwarder = (index % 5 == 0) || ((index % 10) >= 3 && (index % 10) < 7)

[Config CAP_A6]
extends = CAP_AttackBase
description = "Capture: Radio Jamming (physical plane)"
*.vehicle[*].attackType = "RadioJamming"
*.vehicle[*].attackModuleType = "veremivndn.attacks.crosslayer.RadioJamming"
*.vehicle[*].attackIntensity = 0.85
*.vehicle[*].attackBurstOnWindow = 15s
*.vehicle[*].attackBurstOffWindow = 15s
*.vehicle[*].attackParameters = "{\"jammingPower\":28, \"dutyCycle\":0.6, \"targetChannel\":178, \"jammingType\":\"REACTIVE\", \"range\":250.0}"

[Config CAP_A7]
extends = CAP_AttackBase
description = "Capture: Replay Attack (data plane, freshness)"
*.vehicle[*].attackType = "ReplayAttack"
*.vehicle[*].attackModuleType = "veremivndn.attacks.data.ReplayAttack"
*.vehicle[*].attackIntensity = 0.50
*.vehicle[*].attackBurstOnWindow = 50s
*.vehicle[*].attackBurstOffWindow = 50s
*.vehicle[*].attackParameters = "{\"replayWindow\":10, \"freshnessThreshold\":2, \"targetPrefix\":\"/info\", \"captureRate\":0.4, \"replayProbability\":0.6}"
# Replay needs the attacker to be able to re-emit captured Data.
*.vehicle[*].isContentProducer = (index % 5 == 0) || (index % 10) < 3

[Config CAP_A8]
extends = CAP_AttackBase
description = "Capture: ML Evasion (cross-layer adversarial)"
*.vehicle[*].attackType = "MLEvasion"
*.vehicle[*].attackModuleType = "veremivndn.attacks.crosslayer.MLEvasion"
*.vehicle[*].attackIntensity = 0.90
*.vehicle[*].attackBurstOnWindow = 35s
*.vehicle[*].attackBurstOffWindow = 65s
*.vehicle[*].attackParameters = "{\"epsilon\":0.05, \"pgdSteps\":10, \"perturbationDim\":110, \"targetClassifier\":\"BiLSTM\"}"

[Config CAP_MultiAttack]
extends = CAP_AttackBase
description = "Capture: all eight families concurrently, one family per attacker slot"
*.vehicle[*].attackType = (int(index/5) % 8 == 0) ? "ContentPoisoning" : ((int(index/5) % 8 == 1) ? "CachePollution" : ((int(index/5) % 8 == 2) ? "CachePrivacyLeakage" : ((int(index/5) % 8 == 3) ? "SybilAmplification" : ((int(index/5) % 8 == 4) ? "SelectiveForwarding" : ((int(index/5) % 8 == 5) ? "RadioJamming" : ((int(index/5) % 8 == 6) ? "ReplayAttack" : "MLEvasion"))))))
*.vehicle[*].attackModuleType = (int(index/5) % 8 == 0) ? "veremivndn.attacks.data.ContentPoisoning" : ((int(index/5) % 8 == 1) ? "veremivndn.attacks.caching.CachePollution" : ((int(index/5) % 8 == 2) ? "veremivndn.attacks.caching.CachePrivacyLeakage" : ((int(index/5) % 8 == 3) ? "veremivndn.attacks.trust.SybilAmplification" : ((int(index/5) % 8 == 4) ? "veremivndn.attacks.crosslayer.SelectiveForwarding" : ((int(index/5) % 8 == 5) ? "veremivndn.attacks.crosslayer.RadioJamming" : ((int(index/5) % 8 == 6) ? "veremivndn.attacks.data.ReplayAttack" : "veremivndn.attacks.crosslayer.MLEvasion"))))))
*.vehicle[*].attackIntensity = 0.70
*.vehicle[*].isContentProducer = (index % 5 == 0) || (index % 10) < 3
*.vehicle[*].isForwarder = (index % 5 == 0) || ((index % 10) >= 3 && (index % 10) < 7)
