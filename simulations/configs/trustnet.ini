#
# ============================================================================
#  TrustNet-VNDN  -  real OMNeT++/Veins/SUMO feature generation
# ============================================================================
#  Reuses the purpose-built Urban VNDN scenario (UrbanVndnNetwork + urban SUMO
#  map) and the existing VNDN node/NDN parameters. The TrustNetCollector exports
#  per-vehicle, per-window behavioural features for the five VeReMi position-
#  falsification attack types plus a benign baseline.
#
#  Start SUMO first:  python3 ../../../veins/bin/veins_launchd -vv -p 9999
#  Run e.g.:          ../out/gcc-release/VeReMiVNDN -u Cmdenv -c TN_T8 \
#                       -f configs/trustnet.ini -n ...   (see report)
#

[General]
network = veremivndn.simulations.scenarios.TrustNetNetwork

cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 20s
allow-object-stealing-on-deletion = true

sim-time-limit = 150s
warmup-period = 10s

*.playgroundSizeX = 15000m
*.playgroundSizeY = 16000m
*.playgroundSizeZ = 50m
num-rngs = 3
seed-set = ${runnumber}
**.mobility.rng-0 = 1

output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
**.vector-recording = false
**.scalar-recording = true

# ---- Veins / TraCI (LuST: Luxembourg SUMO Traffic, morning-peak window) ----
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("../scenarios/sumo/lust/lust.launchd.xml")
*.manager.moduleType = "veremivndn.vndn.node.VndnVehicle"
*.manager.moduleName = "vehicle"
*.manager.moduleDisplayString = ""

# ---- Connection manager / radio ----
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 600m
*.connectionManager.drawMaxIntfDist = false
*.connectionManager.pMax = 20mW
*.connectionManager.sat = -89dBm
*.connectionManager.alpha = 2.0
*.connectionManager.carrierFrequency = 5.890e9 Hz
*.world.useTorus = false
*.world.use2D = false

# ---- Vehicles ----
*.vehicle[*].applicationType = "VndnVehicle"
*.vehicle[*].mobilityType = "TraCIMobility"
*.vehicle[*].nodeId = index
*.vehicle[*].mobility.x = 0
*.vehicle[*].mobility.y = 0
*.vehicle[*].mobility.z = 0
*.vehicle[*].pitMaxSize = 1000
*.vehicle[*].fibMaxSize = 500
*.vehicle[*].csMaxSize = 100
*.vehicle[*].forwardingStrategy = "BestRoute"
*.vehicle[*].enableCaching = false
*.vehicle[*].communicationRange = 300m
*.vehicle[*].beaconInterval = 0.1s
*.vehicle[*].hasIDSModule = false
**.ndnNode.enableSignatureVerification = false
**.ndnNode.enableCaching = false

# 802.11p NIC
*.vehicle[*].nic.mac1609_4.useServiceChannel = false
*.vehicle[*].nic.mac1609_4.txPower = 20mW
*.vehicle[*].nic.mac1609_4.bitrate = 6Mbps
*.vehicle[*].nic.mac1609_4.useAcks = false
*.vehicle[*].nic.phy80211p.minPowerLevel = -110dBm
*.vehicle[*].nic.phy80211p.useNoiseFloor = true
*.vehicle[*].nic.phy80211p.noiseFloor = -98dBm
*.vehicle[*].nic.phy80211p.decider = xmldoc("config.xml")
*.vehicle[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.vehicle[*].nic.phy80211p.usePropagationDelay = true
*.vehicle[*].nic.phy80211p.antennaOffsetZ = 1.895m

# ---- RSUs (producers; detectors/TRIDENT off for lightweight generation) ----
*.rsu[*].producedPrefixes = "/traffic,/safety,/info"
*.rsu[*].hasIDSModule = false
*.rsu[*].hasDPIDSModule = false
*.rsu[*].hasTridentModule = false
*.rsu[*].nic.mac1609_4.useServiceChannel = false
*.rsu[*].nic.mac1609_4.txPower = 20mW
*.rsu[*].nic.mac1609_4.bitrate = 6Mbps
*.rsu[*].nic.mac1609_4.useAcks = false
*.rsu[*].nic.phy80211p.minPowerLevel = -110dBm
*.rsu[*].nic.phy80211p.useNoiseFloor = true
*.rsu[*].nic.phy80211p.noiseFloor = -98dBm
*.rsu[*].nic.phy80211p.decider = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.usePropagationDelay = true

# ---- TrustNet collector ----
*.trustnetCollector.windowSize = 20
*.trustnetCollector.maxWindows = 60
*.trustnetCollector.beaconInterval = 0.1s

# ======================================================================
# Configs: benign + five VeReMi position-falsification attack types
# Each attacker config makes ~30% of vehicles attackers of that type.
# ======================================================================
[Config TN_Benign]
*.vehicle[*].controller.posAttackType = 0
*.vehicle[*].controller.posAttackerDensity = 0.0
*.trustnetCollector.outputFile = "results/trustnet_TN_Benign.csv"

[Config TN_T1]
*.vehicle[*].controller.posAttackType = 1
*.vehicle[*].controller.posAttackerDensity = 0.30
*.trustnetCollector.outputFile = "results/trustnet_TN_T1.csv"

[Config TN_T2]
*.vehicle[*].controller.posAttackType = 2
*.vehicle[*].controller.posAttackerDensity = 0.30
*.trustnetCollector.outputFile = "results/trustnet_TN_T2.csv"

[Config TN_T4]
*.vehicle[*].controller.posAttackType = 4
*.vehicle[*].controller.posAttackerDensity = 0.30
*.trustnetCollector.outputFile = "results/trustnet_TN_T4.csv"

[Config TN_T8]
*.vehicle[*].controller.posAttackType = 8
*.vehicle[*].controller.posAttackerDensity = 0.30
*.trustnetCollector.outputFile = "results/trustnet_TN_T8.csv"

[Config TN_T16]
*.vehicle[*].controller.posAttackType = 16
*.vehicle[*].controller.posAttackerDensity = 0.30
*.trustnetCollector.outputFile = "results/trustnet_TN_T16.csv"
