#
# ============================================================================
#  TRIDENT-VNDN  (Paper 3)  -  Trust-driven Resilient In-network DEfeNse Tier
# ============================================================================
#
#  Two realistic SUMO/Veins scenarios (Urban grid + Highway corridor), each run
#  in THREE arms so the resilience contribution is measured end-to-end against
#  its own controls:
#
#     <Scenario>_Baseline : no attackers           -> establishes ISR baseline
#     <Scenario>_Attack   : 8 attacks, NO defence  -> ISR collapses
#     <Scenario>_Trident  : 8 attacks + TRIDENT    -> ISR recovers (reversible)
#
#  The ResilienceMonitor writes results/resilience_<config>_<run>.csv (t,ISR,Q)
#  and records the scalars resilienceAURC (R), robustness (rho), timeToRecover
#  (TTR); the TridentController records collateralIsolationRate /
#  attackerContainmentRate; the TrustRegistry records quarantine/reinstatement
#  event counts. Nothing is hard-coded: every number is computed from the live
#  Interest/Data exchange.
#
#  Start SUMO first:  python3 ../../../veins/bin/veins_launchd -vv -p 9999
#  Run e.g.:          ./RUN_TRIDENT.sh Urban_Trident
#

[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 20s

# At attack-stop (t=160s) an attack module's cleanup cancels a timer while the
# Veins PHY ("radio switching over") self-message is the deletion context; that
# 802.11p PHY/NIC is unused by the sendDirect NDN data plane, so allow the
# deletion instead of aborting the run.
allow-object-stealing-on-deletion = true

sim-time-limit = 220s
warmup-period = 20s

# Playground size now comes from each network's NED default, sized to the
# purpose-built maps (UrbanVndnNetwork 1100x1100 m for the 1040 m grid;
# HighwayVndnNetwork 4600x900 m for the 4.5 km corridor). The NDN data plane is
# coord-free (deliverToNeighbors broadcasts to all producers/consumers), so the
# playground only needs to contain the node coordinates; it does not affect ISR.
*.playgroundSizeZ = 50m

num-rngs = 3
seed-set = ${runnumber}
**.mobility.rng-0 = 1
**.wlan[*].radio.radioMedium.rng-0 = 2

output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
**.result-recording-modes = +vector,+stats
*.*.vector-recording = true
*.*.scalar-recording = true

# ---- Visualisation (Qtenv) ----
# Per-node coverage discs and V2V signal halos are drawn from the NED display
# strings (the r= tags on each RSU and vehicle), so they are physically scaled
# to the true radio range per scenario (300 m urban / 500 m highway cells,
# ~150-250 m V2V). The previous INET-visualizer 5 km override is removed: it
# painted a misleading uniform ring and did not match the real range.
*.visualizer.*.displayModuleName = true

# ---- Veins / TraCI ----
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
# Run every arm for the full sim-time-limit (do not end when SUMO momentarily
# reports no vehicles, which can fire spuriously under heavy attack load and
# would truncate the resilience window).
*.manager.autoShutdown = false
*.manager.moduleType = "veremivndn.vndn.node.VndnVehicle"
*.manager.moduleName = "vehicle"
*.manager.moduleDisplayString = ""

# ---- Connection manager / radio ----
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 600m
*.connectionManager.drawMaxIntfDist = false
*.connectionManager.pMax = 20mW
*.connectionManager.sat = -89dBm
*.connectionManager.alpha = 2.0
*.connectionManager.carrierFrequency = 5.890e9 Hz
*.world.useTorus = false
*.world.use2D = false

# ---- Vehicles (consumers) ----
*.vehicle[*].applicationType = "VndnVehicle"
*.vehicle[*].mobilityType = "TraCIMobility"
*.vehicle[*].nodeId = index
*.vehicle[*].mobility.x = 0
*.vehicle[*].mobility.y = 0
*.vehicle[*].mobility.z = 0
*.vehicle[*].pitMaxSize = 1000
*.vehicle[*].fibMaxSize = 500
*.vehicle[*].csMaxSize = 100
*.vehicle[*].forwardingStrategy = "BestRoute"
*.vehicle[*].cacheReplacementPolicy = "LRU"
*.vehicle[*].enableCaching = true
*.vehicle[*].enableSignatureVerification = true
*.vehicle[*].signatureVerificationDelay = 1ms
*.vehicle[*].communicationRange = 300m
*.vehicle[*].beaconInterval = 0.5s

# Real NDN forwarder behaviour (two-face model): per-hop signature verification is
# OFF so the FIRST matching Data (valid or poisoned) consumes the PIT, exactly as
# an unverifying forwarder would; the consumer application then validates the
# delivered content (RSU-key signature + trust) when scoring the ISR.
# Consumers issue UNIQUE one-shot names, so the Content Store never yields a hit;
# caching is disabled to avoid per-Data CS-insert churn. The resilience result is
# driven by the genuine PIT race at the consumer and TRIDENT's reversible sender
# isolation, independent of the CS.
**.ndnNode.enableSignatureVerification = false
**.ndnNode.enableCaching = false

# The DP-IDS detectors live on the RSUs in this paper, so the on-board legacy IDS
# is disabled to keep the vehicles lightweight.
*.vehicle[*].hasIDSModule = false

# 802.11p NIC
*.vehicle[*].nic.mac1609_4.useServiceChannel = false
*.vehicle[*].nic.mac1609_4.txPower = 20mW
*.vehicle[*].nic.mac1609_4.bitrate = 6Mbps
*.vehicle[*].nic.mac1609_4.useAcks = false
*.vehicle[*].nic.phy80211p.minPowerLevel = -110dBm
*.vehicle[*].nic.phy80211p.useNoiseFloor = true
*.vehicle[*].nic.phy80211p.noiseFloor = -98dBm
*.vehicle[*].nic.phy80211p.decider = xmldoc("config.xml")
*.vehicle[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.vehicle[*].nic.phy80211p.usePropagationDelay = true
*.vehicle[*].nic.phy80211p.antennaOffsetY = 0m
*.vehicle[*].nic.phy80211p.antennaOffsetZ = 1.895m

# ---- RSUs (producers + DP-IDS evidence + TRIDENT control plane) ----
*.rsu[*].producedPrefixes = "/traffic,/safety,/info"
*.rsu[*].contentUpdateInterval = 1s
*.rsu[*].hasIDSModule = false

# DP-IDS evidence pipeline (detectors + DS fusion + strategy). Detection only;
# penalisation by the legacy DP-IDS controller is OFF -- TRIDENT owns mitigation.
*.rsu[*].hasDPIDSModule = true
*.rsu[*].dpidsEnablePenalization = false
*.rsu[*].dpidsOrchestrationInterval = 1s

# TRIDENT trust controller (overridden per arm). Default: present but defined
# by each config below.
*.rsu[*].hasTridentModule = false
*.rsu[*].tridentControlInterval = 1s
*.rsu[*].tridentAlpha = 0.40
*.rsu[*].tridentBeta = 0.05
*.rsu[*].tridentTauQuarantine = 0.40
*.rsu[*].tridentTauReinstate = 0.55
*.rsu[*].tridentWindowQuarantine = 10s
*.rsu[*].tridentEnableMitigation = true

# RSU 802.11p NIC
*.rsu[*].nic.mac1609_4.useServiceChannel = false
*.rsu[*].nic.mac1609_4.txPower = 20mW
*.rsu[*].nic.mac1609_4.bitrate = 6Mbps
*.rsu[*].nic.mac1609_4.useAcks = false
*.rsu[*].nic.phy80211p.minPowerLevel = -110dBm
*.rsu[*].nic.phy80211p.useNoiseFloor = true
*.rsu[*].nic.phy80211p.noiseFloor = -98dBm
*.rsu[*].nic.phy80211p.decider = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.usePropagationDelay = true

# ---- RSU positions (read by the broadcast data plane) ----
# Placed over the ACTUAL Al-Jubail traffic cluster (road junctions concentrate at
# x~5800-9080, y~8300-10150). A 4x2 core grid plus two edge RSUs gives the moving
# vehicles continuous infrastructure coverage. Stationary RSUs carry explicit
# coordinates (no mobility submodule).
*.rsu[*].rsuRange = 2500m
*.rsu[0].rsuPosX = 5800m
*.rsu[0].rsuPosY = 8500m
*.rsu[1].rsuPosX = 7300m
*.rsu[1].rsuPosY = 8500m
*.rsu[2].rsuPosX = 8800m
*.rsu[2].rsuPosY = 8500m
*.rsu[3].rsuPosX = 10300m
*.rsu[3].rsuPosY = 8500m
*.rsu[4].rsuPosX = 5800m
*.rsu[4].rsuPosY = 10000m
*.rsu[5].rsuPosX = 7300m
*.rsu[5].rsuPosY = 10000m
*.rsu[6].rsuPosX = 8800m
*.rsu[6].rsuPosY = 10000m
*.rsu[7].rsuPosX = 10300m
*.rsu[7].rsuPosY = 10000m
*.rsu[8].rsuPosX = 7300m
*.rsu[8].rsuPosY = 11500m
*.rsu[9].rsuPosX = 6500m
*.rsu[9].rsuPosY = 7000m

# ---- TRIDENT control-plane singletons ----
*.trustRegistry.tauQuarantine = 0.40
*.trustRegistry.tauReinstate = 0.55
*.resilienceMonitor.sampleInterval = 2s
*.resilienceMonitor.baselineStart = 25s
*.resilienceMonitor.attackStart = 60s
*.resilienceMonitor.attackEnd = 160s
*.resilienceMonitor.recoveryThreshold = 0.90

# Poisoning-resilient cache admission (TRIDENT prong 2). OFF by default; the
# *_Trident arms switch it on.
*.vehicle[*].ndnNode.processor.enableTridentAdmission = false

# ============================================================================
#  ATTACK MIX  (the 8 attacks this paper targets)
#  Shared by every *_Attack and *_Trident arm. Service-degrading attacks are
#  aligned to the /safety prefix that consumers actually request, so they bite
#  the measured Interest-satisfaction ratio. Privacy attacks are included for
#  completeness (scored by leakage containment, not ISR).
# ============================================================================
[Config _AttackMix]
# -- Service-degrading (scored by resilience R) --
*.vehicle[0..2].attackType = "ContentPoisoning"
*.vehicle[0..2].attackModuleType = "veremivndn.attacks.data.ContentPoisoning"
*.vehicle[0..2].attackParameters = "{\"targetPrefix\":\"/safety\", \"poisonProbability\":0.8}"

*.vehicle[3..4].attackType = "CacheInvalidation"
*.vehicle[3..4].attackModuleType = "veremivndn.attacks.data.CacheInvalidation"
*.vehicle[3..4].attackParameters = "{\"targetPrefix\":\"/safety\", \"invalidationRate\":3, \"rapidVersions\":true, \"forceCacheEviction\":true}"

*.vehicle[5].attackType = "ProducerImpersonation"
*.vehicle[5].attackModuleType = "veremivndn.attacks.data.ProducerImpersonation"
*.vehicle[5].attackParameters = "{\"targetPrefix\":\"/safety\", \"impersonate\":\"RSU\"}"

*.vehicle[6].attackType = "SignatureForgery"
*.vehicle[6].attackModuleType = "veremivndn.attacks.trust.SignatureForgery"
*.vehicle[6].attackParameters = "{\"targetPrefix\":\"/safety\", \"forgeSignatures\":true, \"validSignature\":false, \"forgeryRate\":3}"

*.vehicle[7].attackType = "Collusion"
*.vehicle[7].attackModuleType = "veremivndn.attacks.trust.Collusion"
*.vehicle[7].attackParameters = "{\"collusionGroup\":\"g1\", \"coordinatedAttack\":\"ContentPoisoning\", \"synchronize\":true}"

*.vehicle[8].attackType = "CachePartitioning"
*.vehicle[8].attackModuleType = "veremivndn.attacks.caching.CachePartitioning"
*.vehicle[8].attackParameters = "{\"targetPrefix\":\"/safety\", \"partitionRate\":3}"

# -- Privacy (scored by leakage containment) --
*.vehicle[9].attackType = "NameEnumeration"
*.vehicle[9].attackModuleType = "veremivndn.attacks.privacy.NameEnumeration"
*.vehicle[9].attackParameters = "{\"enumerationRate\":3, \"targetPrefix\":\"/safety\"}"

# Common attack lifecycle for the 10 attackers.
*.vehicle[0..9].hasAttackModule = true
*.vehicle[0..9].attackStartTime = 60s
*.vehicle[0..9].attackDuration = 100s
*.vehicle[0..9].attackIntensity = 0.8

# ---- Content-integrity adversaries act as on-path producers for /safety ----
# These attack modules transform Data that passes through them (ContentPoisoning
# blanks the signature/content; ProducerImpersonation/SignatureForgery forge it).
# Making the node a /safety producer means the forwarder routes overheard
# Interests up to its producer app; the answer Data then traverses the
# attackModule and is poisoned at the packet level before being broadcast.
# A poisoner does not issue Interests, so it is excluded from the ISR denominator.
*.vehicle[0..2].isContentProducer = true
*.vehicle[0..2].producedPrefixes = "/safety"
*.vehicle[5].isContentProducer = true
*.vehicle[5].producedPrefixes = "/safety"
*.vehicle[6].isContentProducer = true
*.vehicle[6].producedPrefixes = "/safety"

# ============================================================================
#  TRIDENT activation overlay (applied by every *_Trident arm)
# ============================================================================
[Config _TridentOn]
*.rsu[*].hasTridentModule = true
*.rsu[*].tridentEnableMitigation = true
*.vehicle[*].ndnNode.processor.enableTridentAdmission = true

# ============================================================================
#  SCENARIO 1 : URBAN GRID  (dense, low speed, frequent handover)
# ============================================================================
[Config Urban_Baseline]
network = veremivndn.simulations.scenarios.UrbanVndnNetwork
*.manager.launchConfig = xmldoc("../scenarios/sumo/urban_enhanced.launchd.xml")
description = "Urban grid, no attackers (ISR baseline)"
*.numVehicles = 60
*.numRSU = 10
# Park the DP-IDS dashboard below the RSU field (icons end at y=925) so it does
# not cover rsu[3]; only rsu[0] draws it.
*.rsu[*].dpidsController.dashX = 1000
*.rsu[*].dpidsController.dashY = 950
# (hasAttackModule defaults to false; do NOT pin it here, or the wildcard would
# be matched before _AttackMix's vehicle[0..9]=true in the *_Attack/*_Trident arms
# and silently disable every attacker.)

[Config Urban_Attack]
extends = Urban_Baseline, _AttackMix
description = "Urban grid, 8 attacks active, NO defence"

[Config Urban_Trident]
extends = Urban_Baseline, _AttackMix, _TridentOn
description = "Urban grid, 8 attacks + TRIDENT mitigation"

# ============================================================================
#  SCENARIO 2 : HIGHWAY CORRIDOR  (high speed, platooning, sparse RSUs)
# ============================================================================
[Config Highway_Baseline]
network = veremivndn.simulations.scenarios.HighwayVndnNetwork
*.manager.launchConfig = xmldoc("../scenarios/sumo/highway_enhanced.launchd.xml")
description = "Highway corridor, no attackers (ISR baseline)"
*.numVehicles = 80
*.numRSU = 8
*.vehicle[*].communicationRange = 500m
# Park the DP-IDS dashboard below the carriageway (RSU icons sit at y=345) and
# between the infrastructure icons at x=1600 and x=2200, so it covers nothing.
*.rsu[*].dpidsController.dashX = 1700
*.rsu[*].dpidsController.dashY = 880
# (see Urban_Baseline note: do not pin hasAttackModule here)

[Config Highway_Attack]
extends = Highway_Baseline, _AttackMix
description = "Highway corridor, 8 attacks active, NO defence"

[Config Highway_Trident]
extends = Highway_Baseline, _AttackMix, _TridentOn
description = "Highway corridor, 8 attacks + TRIDENT mitigation"

# ============================================================================
#  Per-attack resilience sweep (Urban) for the per-attack R table in the paper.
#  Each isolates ONE service-degrading attack on vehicle[0..4], with TRIDENT on.
# ============================================================================
[Config Urban_OneAttack_Base]
extends = Urban_Baseline, _TridentOn
*.vehicle[0..4].hasAttackModule = true
*.vehicle[0..4].attackStartTime = 60s
*.vehicle[0..4].attackDuration = 100s
*.vehicle[0..4].attackIntensity = 0.8

[Config Urban_Poisoning_Trident]
extends = Urban_OneAttack_Base
*.vehicle[0..4].attackType = "ContentPoisoning"
*.vehicle[0..4].attackModuleType = "veremivndn.attacks.data.ContentPoisoning"
*.vehicle[0..4].attackParameters = "{\"targetPrefix\":\"/safety\", \"poisonProbability\":0.8}"

[Config Urban_Invalidation_Trident]
extends = Urban_OneAttack_Base
*.vehicle[0..4].attackType = "CacheInvalidation"
*.vehicle[0..4].attackModuleType = "veremivndn.attacks.data.CacheInvalidation"
*.vehicle[0..4].attackParameters = "{\"targetPrefix\":\"/safety\", \"invalidationRate\":10, \"rapidVersions\":true}"

[Config Urban_Impersonation_Trident]
extends = Urban_OneAttack_Base
*.vehicle[0..4].attackType = "ProducerImpersonation"
*.vehicle[0..4].attackModuleType = "veremivndn.attacks.data.ProducerImpersonation"
*.vehicle[0..4].attackParameters = "{\"targetPrefix\":\"/safety\", \"impersonate\":\"RSU\"}"
