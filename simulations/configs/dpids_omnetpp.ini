#
# DP-IDS-VNDN — Publication Evaluation Configuration
#
# Dual-Plane Intrusion Detection System for Vehicular Named Data Networking
# Heterogeneous 5G NR + IEEE 802.11p + NDN Architecture
#
# Three consolidated scenarios for paper evaluation:
#   Scenario A: Benign baseline (no attacks)
#   Scenario B: Multi-attack with DP-IDS (CS Poisoning + PIT Flooding + FIB Hijacking)
#   Scenario C: Baseline comparison (B1/B2/B3/B4 vs DP-IDS under same attack)
#
# Usage:
#   ./RUN_DPIDS.sh Scenario_A          # Benign baseline
#   ./RUN_DPIDS.sh Scenario_B          # Multi-attack evaluation
#   ./RUN_DPIDS.sh Scenario_C          # Baseline comparison (4 runs via iteration)
#

# ======================================================================
# [General] — SHARED CONFIGURATION FOR ALL SCENARIOS
# ======================================================================
[General]
network = veremivndn.simulations.scenarios.DPIDSNetwork

# --- Runtime ---
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 10s
sim-time-limit = 500s
warmup-period = 30s

# --- RNG ---
num-rngs = 3
seed-set = ${runnumber}
**.mobility.rng-0 = 1

# --- Output ---
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
**.result-recording-modes = default
*.*.vector-recording = true
*.*.scalar-recording = true

# --- Reduce 5G core recording (save disk) ---
**.gnb[*].**.vector-recording = false
**.upf.**.vector-recording = false
**.server.**.vector-recording = false
**.router.**.vector-recording = false

# ======================================================================
# PLAYGROUND & WORLD
# ======================================================================
*.playgroundSizeX = 15000m
*.playgroundSizeY = 16000m
*.playgroundSizeZ = 50m
*.world.useTorus = false
*.world.use2D = false

# ======================================================================
# VEINS-INET MANAGER (SUMO Integration)
# ======================================================================
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("../scenarios/sumo/aljubail_saudi.launchd.xml")
*.manager.moduleType = "veremivndn.vndn.node.VndnNRVehicle"
*.manager.moduleName = "vehicle"
*.manager.moduleDisplayString = ""

# ======================================================================
# 802.11p CONNECTION MANAGER (RSU V2V communication)
# ======================================================================
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 500m
*.connectionManager.drawMaxIntfDist = false
*.connectionManager.pMax = 20mW
*.connectionManager.sat = -89dBm
*.connectionManager.alpha = 2.0
*.connectionManager.carrierFrequency = 5.890e9 Hz

# ======================================================================
# 5G NR INFRASTRUCTURE (Simu5G)
# ======================================================================

# --- Carrier: 2 GHz Band n1, 50 RBs, numerology 0 (15 kHz SCS) ---
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0

# --- IPv4 auto-configuration ---
*.configurator.config = xml("<config><interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/></config>")

# --- 5 gNodeBs covering Al-Jubail map (grid pattern, ~4 km cell radius) ---
*.numGNodeBs = 5

*.gnb[*].mobility.constraintAreaMinX = 0m
*.gnb[*].mobility.constraintAreaMinY = 0m
*.gnb[*].mobility.constraintAreaMinZ = 0m
*.gnb[*].mobility.constraintAreaMaxX = 15000m
*.gnb[*].mobility.constraintAreaMaxY = 16000m
*.gnb[*].mobility.constraintAreaMaxZ = 50m

# --- gNodeB positions and GUI display (matching Al-Jubail coverage pattern) ---
# gnb[0]: Southwest quadrant
*.gnb[0].mobility.initialX = 3500m
*.gnb[0].mobility.initialY = 4000m
*.gnb[0].mobility.initialZ = 25m

# gnb[1]: Southeast quadrant
*.gnb[1].mobility.initialX = 11000m
*.gnb[1].mobility.initialY = 4000m
*.gnb[1].mobility.initialZ = 25m

# gnb[2]: Center
*.gnb[2].mobility.initialX = 7500m
*.gnb[2].mobility.initialY = 8000m
*.gnb[2].mobility.initialZ = 25m

# gnb[3]: Northwest quadrant
*.gnb[3].mobility.initialX = 3500m
*.gnb[3].mobility.initialY = 12000m
*.gnb[3].mobility.initialZ = 25m

# gnb[4]: Northeast quadrant
*.gnb[4].mobility.initialX = 11000m
*.gnb[4].mobility.initialY = 12000m
*.gnb[4].mobility.initialZ = 25m

# --- gNodeB channel model (Rural Macrocell, no shadowing for determinism) ---
*.gnb[*].cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"
*.gnb[*].cellularNic.channelModel[0].shadowing = false
*.gnb[*].cellularNic.channelModel[0].nodeb_height = 35
*.gnb[*].cellularNic.channelModel[0].ue_height = 1.5
*.gnb[*].cellularNic.channelModel[0].building_height = 10
*.gnb[*].cellularNic.channelModel[0].street_wide = 25
*.gnb[*].cellularNic.channelModel[0].tolerateMaxDistViolation = true
*.gnb[*].txPower = 40000mw

# --- 5G Core Network ---
*.upf.forwarding = true

# --- 5G Core Network: Server -> Router -> UPF (top-center backhaul chain) ---
*.server.mobility.constraintAreaMinX = 0m
*.server.mobility.constraintAreaMinY = 0m
*.server.mobility.constraintAreaMinZ = 0m
*.server.mobility.constraintAreaMaxX = 15000m
*.server.mobility.constraintAreaMaxY = 16000m
*.server.mobility.constraintAreaMaxZ = 50m
*.server.mobility.initialX = 13500m
*.server.mobility.initialY = 1200m

*.router.mobility.constraintAreaMinX = 0m
*.router.mobility.constraintAreaMinY = 0m
*.router.mobility.constraintAreaMinZ = 0m
*.router.mobility.constraintAreaMaxX = 15000m
*.router.mobility.constraintAreaMaxY = 16000m
*.router.mobility.constraintAreaMaxZ = 50m
*.router.mobility.initialX = 10500m
*.router.mobility.initialY = 1200m

*.upf.mobility.constraintAreaMinX = 0m
*.upf.mobility.constraintAreaMinY = 0m
*.upf.mobility.constraintAreaMinZ = 0m
*.upf.mobility.constraintAreaMaxX = 15000m
*.upf.mobility.constraintAreaMaxY = 16000m
*.upf.mobility.constraintAreaMaxZ = 50m
*.upf.mobility.initialX = 7500m
*.upf.mobility.initialY = 1200m

# ======================================================================
# VEHICLE CONFIGURATION (VndnNRVehicle = NRCar + NDN)
# ======================================================================
*.vehicle[*].nodeId = index
*.vehicle[*].mobility.typename = "VeinsInetMobility"

# --- 5G NR cell association ---
*.vehicle[*].masterId = 0
*.vehicle[*].macNodeId = 0
*.vehicle[*].macCellId = 0
*.vehicle[*].nrMasterId = 1
*.vehicle[*].nrMacNodeId = 0
*.vehicle[*].nrMacCellId = 1
*.vehicle[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.vehicle[*].cellularNic.nrPhy.enableHandover = true

# --- Vehicle NR channel model ---
*.vehicle[*].cellularNic.nrChannelModel[0].scenario = "RURAL_MACROCELL"
*.vehicle[*].cellularNic.nrChannelModel[0].shadowing = false
*.vehicle[*].cellularNic.nrChannelModel[0].nodeb_height = 35
*.vehicle[*].cellularNic.nrChannelModel[0].ue_height = 1.5
*.vehicle[*].cellularNic.nrChannelModel[0].tolerateMaxDistViolation = true

# --- IPv4 ---
*.vehicle[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.vehicle[*].ipv4.configurator.interfaces = "cellular"
*.vehicle[*].*.routingTableModule = absPath(".ipv4.routingTable")

# --- 5G NR UDP App (generates throughput/latency/jitter metrics) ---
*.vehicle[*].numApps = 1
*.vehicle[*].app[0].typename = "UdpBasicApp"
*.vehicle[*].app[0].localPort = -1
*.vehicle[*].app[0].destAddresses = "server"
*.vehicle[*].app[0].destPort = 3000
*.vehicle[*].app[0].messageLength = 100B
*.vehicle[*].app[0].sendInterval = 0.1s
*.vehicle[*].app[0].startTime = uniform(0.02s, 0.05s)
*.vehicle[*].app[0].stopTime = 500s

# --- Server UDP receiver ---
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 3000

# --- NDN Stack ---
*.vehicle[*].pitMaxSize = 1000
*.vehicle[*].fibMaxSize = 500
*.vehicle[*].csMaxSize = 100
*.vehicle[*].forwardingStrategy = "BestRoute"
*.vehicle[*].cacheReplacementPolicy = "LRU"
*.vehicle[*].enableCaching = true
*.vehicle[*].enableSignatureVerification = true
*.vehicle[*].signatureVerificationDelay = 1ms
*.vehicle[*].communicationRange = 500m
*.vehicle[*].beaconInterval = 0.1s
*.vehicle[*].initialTrustScore = 1.0
*.vehicle[*].useTrustModel = true
*.vehicle[*].hasIDSModule = false
*.vehicle[*].hasAttackModule = false

# ======================================================================
# RSU CONFIGURATION (5 RSUs with DP-IDS)
# ======================================================================
*.numRSU = 5
*.rsu[*].nodeId = 1000 + index
*.rsu[*].producedPrefixes = "/traffic,/safety,/info"

# --- RSU Positions and GUI Display (Al-Jubail map coverage) ---
# Each RSU gets an explicit canvas position matching its simulated location.
# rsu[0]: Southwest
*.rsu[0].mobility.x = 3361
*.rsu[0].mobility.y = 3690
*.rsu[0].mobility.z = 10
*.rsu[0].@display = "p=3361,3690"

# rsu[1]: Southeast
*.rsu[1].mobility.x = 10083
*.rsu[1].mobility.y = 3690
*.rsu[1].mobility.z = 10
*.rsu[1].@display = "p=10083,3690"

# rsu[2]: Center
*.rsu[2].mobility.x = 6722
*.rsu[2].mobility.y = 7380
*.rsu[2].mobility.z = 10
*.rsu[2].@display = "p=6722,7380"

# rsu[3]: Northwest
*.rsu[3].mobility.x = 3361
*.rsu[3].mobility.y = 11070
*.rsu[3].mobility.z = 10
*.rsu[3].@display = "p=3361,11070"

# rsu[4]: Northeast
*.rsu[4].mobility.x = 10083
*.rsu[4].mobility.y = 11070
*.rsu[4].mobility.z = 10
*.rsu[4].@display = "p=10083,11070"

*.rsu[*].pitMaxSize = 5000
*.rsu[*].fibMaxSize = 2000
*.rsu[*].csMaxSize = 1000
*.rsu[*].forwardingStrategy = "Multicast"

*.rsu[*].nic.mac1609_4.useServiceChannel = false
*.rsu[*].nic.mac1609_4.txPower = 40mW
*.rsu[*].nic.mac1609_4.bitrate = 6Mbps
*.rsu[*].nic.phy80211p.minPowerLevel = -110dBm
*.rsu[*].nic.phy80211p.useNoiseFloor = true
*.rsu[*].nic.phy80211p.noiseFloor = -98dBm
*.rsu[*].nic.phy80211p.decider = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.rsu[*].nic.phy80211p.usePropagationDelay = true

# ======================================================================
# VISUALIZATION (Qtenv only — ignored in Cmdenv)
# ======================================================================
*.visualizer.typename = "IntegratedCanvasVisualizer"
*.visualizer.*.mobilityVisualizer.displayMobility = true
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 200
*.visualizer.*.mobilityVisualizer.displayVelocities = true
*.visualizer.*.networkNodeVisualizer.displayModuleName = true


# ######################################################################
#                        SCENARIO DEFINITIONS
# ######################################################################

# ======================================================================
# SCENARIO A: BENIGN BASELINE
# ======================================================================
# Purpose: Establish all baseline metrics with zero attacks.
# Paper usage: Table columns "Benign", baseline FPR, QoS under normal load
#
# Expected results:
#   - TP = 0, FP ≈ 0, Accuracy ≈ 100%
#   - SINR, throughput, latency at nominal levels
#   - PIT/CS/FIB sizes at baseline (small)
#
[Config Scenario_A]
description = "Scenario A: Benign Baseline — no attacks, all vehicles legitimate"
*.vehicle[*].hasAttackModule = false


# ======================================================================
# SCENARIO B: MULTI-ATTACK WITH DP-IDS
# ======================================================================
# Purpose: Main evaluation — all 3 forwarding-plane attacks simultaneously,
#          detected by the full DP-IDS framework (LSTM + Isolation Forest + DS Fusion).
# Paper usage: Table 4 — DP-IDS detection performance
#
# Attack configuration:
#   Group 1 (vehicle[0..4]):  CS Poisoning — floods attacker CS with fabricated data
#   Group 2 (vehicle[5..9]):  PIT Flooding — generates unsatisfiable interests
#   Group 3 (vehicle[10..14]): FIB Hijacking — intercepts interests, injects bogus data
#
# All attacks start at t=60s, run for 180s (until t=240s), warmup=30s.
# 15 attackers out of ~50 vehicles ≈ 30% attacker ratio.
#
# Expected results:
#   - TP > 0 for each attack group
#   - Recall > 80% for CS Poisoning (most detectable)
#   - PIT occupancy elevated for Group 2 attackers
#   - CS insertion rate elevated for Group 1 attackers
#   - SINR/throughput may degrade under attack load
#
[Config Scenario_B]
description = "Scenario B: Multi-Attack — CS Poisoning + PIT Flooding + FIB Hijacking with DP-IDS"

# --- Group 1: CS Poisoning (vehicles 0-4) ---
*.vehicle[0..4].hasAttackModule = true
*.vehicle[0..4].attackModuleType = "veremivndn.attacks.forwarding.CSPoisoningAttack"
*.vehicle[0..4].attackStartTime = 60s
*.vehicle[0..4].attackDuration = 180s
*.vehicle[0..4].attackIntensity = 0.8
*.vehicle[0..4].attackParameters = "{\"targetPrefix\":\"/traffic\", \"replaceProbability\":0.8, \"poisonContent\":\"FABRICATED_DATA\", \"maintainBehaviouralProfile\":true}"

# --- Group 2: PIT Flooding (vehicles 5-9) ---
*.vehicle[5..9].hasAttackModule = true
*.vehicle[5..9].attackModuleType = "veremivndn.attacks.forwarding.PITFloodingAttack"
*.vehicle[5..9].attackStartTime = 60s
*.vehicle[5..9].attackDuration = 180s
*.vehicle[5..9].attackIntensity = 0.7
*.vehicle[5..9].attackParameters = "{\"targetPrefix\":\"/safety\", \"floodRate\":30, \"maintainBehaviouralProfile\":true}"

# --- Group 3: FIB Hijacking (vehicles 10-14) ---
*.vehicle[10..14].hasAttackModule = true
*.vehicle[10..14].attackModuleType = "veremivndn.attacks.forwarding.FIBHijackingAttack"
*.vehicle[10..14].attackStartTime = 60s
*.vehicle[10..14].attackDuration = 180s
*.vehicle[10..14].attackIntensity = 0.8
*.vehicle[10..14].attackParameters = "{\"hijackedPrefix\":\"/safety\", \"forgedFaceId\":99, \"announcementInterval\":5.0, \"maintainBehaviouralProfile\":true}"


# ======================================================================
# SCENARIO C: BASELINE COMPARISON (4 IDS configurations under same attack)
# ======================================================================
# Purpose: Compare DP-IDS against 4 baseline approaches under identical attack.
#          Uses OMNeT++ iteration variable to run all baselines in one config.
# Paper usage: Table 5 — Comparative analysis, Figure showing F1/MCC bars
#
# Iteration variable ${approach}:
#   0 = DP-IDS (full dual-plane, r1=0.85, r2=0.90, threshold=0.65)
#   1 = B1: Behavioural-only (r2=0, effectively forwarding plane disabled)
#   2 = B2: Forwarding-only (r1=0, behavioural plane disabled)
#   3 = B3: Naive concatenation (r1=r2=0.50, kMax=1.0 = no conflict detection)
#
# Same multi-attack as Scenario B for fair comparison.
#
[Config Scenario_C]
description = "Scenario C: Baseline Comparison — DP-IDS vs B1/B2/B3 under multi-attack"

# --- Approach selector (tied iteration) ---
# Run 0: DP-IDS full (r1=0.85, r2=0.90, kmax=0.8)
# Run 1: B1 Behavioural-only (r1=0.85, r2=0.0)
# Run 2: B2 Forwarding-only (r1=0.0, r2=0.90)
# Run 3: B3 Naive concatenation (r1=0.50, r2=0.50, kmax=1.0)
*.dpidsReliabilityBehavioural = ${r1=0.85, 0.85, 0.0, 0.50}
*.dpidsReliabilityForwarding = ${r2=0.90, 0.0, 0.90, 0.50 ! r1}
*.dpidsKMax = ${kmax=0.8, 0.8, 0.8, 1.0 ! r1}
*.dpidsBeliefThreshold = 0.15

# --- Same multi-attack as Scenario B ---

# Group 1: CS Poisoning
*.vehicle[0..4].hasAttackModule = true
*.vehicle[0..4].attackModuleType = "veremivndn.attacks.forwarding.CSPoisoningAttack"
*.vehicle[0..4].attackStartTime = 60s
*.vehicle[0..4].attackDuration = 180s
*.vehicle[0..4].attackIntensity = 0.8
*.vehicle[0..4].attackParameters = "{\"targetPrefix\":\"/traffic\", \"replaceProbability\":0.8, \"poisonContent\":\"FABRICATED_DATA\", \"maintainBehaviouralProfile\":true}"

# Group 2: PIT Flooding
*.vehicle[5..9].hasAttackModule = true
*.vehicle[5..9].attackModuleType = "veremivndn.attacks.forwarding.PITFloodingAttack"
*.vehicle[5..9].attackStartTime = 60s
*.vehicle[5..9].attackDuration = 180s
*.vehicle[5..9].attackIntensity = 0.7
*.vehicle[5..9].attackParameters = "{\"targetPrefix\":\"/safety\", \"floodRate\":30, \"maintainBehaviouralProfile\":true}"

# Group 3: FIB Hijacking
*.vehicle[10..14].hasAttackModule = true
*.vehicle[10..14].attackModuleType = "veremivndn.attacks.forwarding.FIBHijackingAttack"
*.vehicle[10..14].attackStartTime = 60s
*.vehicle[10..14].attackDuration = 180s
*.vehicle[10..14].attackIntensity = 0.8
*.vehicle[10..14].attackParameters = "{\"hijackedPrefix\":\"/safety\", \"forgedFaceId\":99, \"announcementInterval\":5.0, \"maintainBehaviouralProfile\":true}"
