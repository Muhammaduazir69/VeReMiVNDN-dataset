<?xml version="1.0" encoding="UTF-8"?>
<!-- TRIDENT-VNDN URBAN GRID: dense signalised city grid (1040 x 1040 m),
     buildings + RSUs + traffic signs, low-speed round-trip traffic. -->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="urban_grid.net.xml"/>
        <route-files value="vTypes.add.xml,urban_grid.rou.xml"/>
        <additional-files value="urban_grid.poly.xml"/>
        <gui-settings-file value="urban_grid.gui.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="2000"/>
        <step-length value="0.1"/>
    </time>
    <processing>
        <collision.action value="warn"/>
        <collision.check-junctions value="true"/>
        <time-to-teleport value="-1"/>
        <max-depart-delay value="900"/>
        <eager-insert value="true"/>
        <pedestrian.model value="nonInteracting"/>
    </processing>
    <routing>
        <device.rerouting.probability value="0.5"/>
        <device.rerouting.period value="30"/>
        <routing-algorithm value="dijkstra"/>
    </routing>
    <report>
        <no-step-log value="true"/>
        <no-warnings value="true"/>
    </report>
    <gui_only>
        <start value="true"/>
        <quit-on-end value="false"/>
        <window-size value="1920,1080"/>
        <delay value="50"/>
    </gui_only>
    <random_number>
        <seed value="23"/>
    </random_number>
</configuration>
