<?xml version="1.0" encoding="UTF-8"?>
<!-- TRIDENT-VNDN HIGHWAY CORRIDOR: 4.5 km divided 3-lane highway with three
     interchanges, frontage buildings + linear RSU chain, high-speed traffic. -->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="highway_corridor.net.xml"/>
        <route-files value="vTypes.add.xml,highway_corridor.rou.xml"/>
        <additional-files value="highway_corridor.poly.xml"/>
        <gui-settings-file value="highway_corridor.gui.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="2000"/>
        <step-length value="0.1"/>
    </time>
    <processing>
        <collision.action value="warn"/>
        <time-to-teleport value="-1"/>
        <time-to-teleport.highways value="120"/>
        <max-depart-delay value="900"/>
        <eager-insert value="true"/>
        <pedestrian.model value="nonInteracting"/>
    </processing>
    <routing>
        <device.rerouting.probability value="0.4"/>
        <device.rerouting.period value="40"/>
        <routing-algorithm value="dijkstra"/>
    </routing>
    <report>
        <no-step-log value="true"/>
        <no-warnings value="true"/>
    </report>
    <gui_only>
        <start value="true"/>
        <quit-on-end value="false"/>
        <window-size value="1920,1080"/>
        <delay value="50"/>
    </gui_only>
    <random_number>
        <seed value="56"/>
    </random_number>
</configuration>
