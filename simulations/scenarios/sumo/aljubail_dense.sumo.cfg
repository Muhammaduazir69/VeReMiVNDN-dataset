<?xml version="1.0" encoding="UTF-8"?>
<!--
  VeReMiVNDN-EXE - JubST-Dense SUMO configuration (production-grade).

  Reuses aljubail_saudi.net.xml but routes vehicles via aljubail_dense.rou.xml,
  which biases trips toward the central business district (dense.dst.xml weights).

  Key invariants (DO NOT CHANGE without coordinating with MI-IDS / OMNeT++):
    - step-length = 0.05 s    -> aligns with the 50 ms feature-extraction
                                  window used by MI-IDS.
    - end        = 2000 s     -> matches the bursty attack on/off cycle
                                  reported in the paper.
    - vehicle types are loaded from vTypes.add.xml so the 18 heterogeneous
      classes (sedan, sport, SUV, taxi, emergency, buses, trucks,
      motorcycles, mopeds, bicycles, pedestrians, etc.) are available.

  This file was upgraded from the original 35-line minimal version.
  The pre-upgrade version is preserved in aljubail_dense.sumo.cfg.bak.
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <!-- ============================================================ -->
    <!-- INPUT FILES                                                  -->
    <!-- ============================================================ -->
    <input>
        <net-file value="aljubail_saudi.net.xml"/>
        <!-- vTypes.add.xml MUST be listed before the route file so the
             18 heterogeneous vType definitions are available to routes. -->
        <route-files value="vTypes.add.xml,aljubail_dense.rou.xml"/>
        <additional-files value="aljubail_saudi.poly.xml"/>
    </input>

    <!-- ============================================================ -->
    <!-- TIME SETTINGS                                                -->
    <!-- ============================================================ -->
    <time>
        <begin value="0"/>
        <end value="2000"/>
        <!-- 0.05 s SUMO step matches MI-IDS 50 ms window. VEINS samples
             every 100 ms via TraCIScenarioManagerLaunchd.updateInterval. -->
        <step-length value="0.05"/>
    </time>

    <!-- ============================================================ -->
    <!-- PROCESSING OPTIONS                                           -->
    <!-- ============================================================ -->
    <processing>
        <!-- Collision handling -->
        <collision.action value="warn"/>
        <collision.check-junctions value="true"/>
        <collision.mingap-factor value="1.0"/>

        <!-- Teleportation: never on city streets, but allow on highways
             after 120 s to prevent simulation freezes during attack
             surges (DDoS / RoutePoisoning) without distorting normal flow. -->
        <time-to-teleport value="-1"/>
        <time-to-teleport.highways value="120"/>

        <!-- Insertion behavior: keep traffic flowing even during peaks. -->
        <max-depart-delay value="900"/>
        <eager-insert value="true"/>
        <extrapolate-departpos value="true"/>

        <!-- Sublane model resolution (m). 0.8 enables visible lane-change
             dynamics for screenshots without huge runtime cost. -->
        <lateral-resolution value="0.8"/>

        <!-- Pedestrian striping model (sidewalks, crossings) -->
        <pedestrian.model value="striping"/>
        <pedestrian.striping.stripe-width value="0.65"/>
        <pedestrian.striping.dawdling value="0.2"/>

        <ignore-route-errors value="true"/>
    </processing>

    <!-- ============================================================ -->
    <!-- ROUTING OPTIONS                                              -->
    <!-- ============================================================ -->
    <routing>
        <device.rerouting.probability value="0.6"/>
        <device.rerouting.period value="30"/>
        <device.rerouting.adaptation-steps value="180"/>
        <device.rerouting.adaptation-interval value="10"/>
        <device.rerouting.pre-period value="60"/>
        <device.rerouting.with-taz value="false"/>
        <routing-algorithm value="dijkstra"/>
    </routing>

    <!-- ============================================================ -->
    <!-- REPORT OPTIONS                                               -->
    <!-- ============================================================ -->
    <report>
        <verbose value="true"/>
        <no-step-log value="true"/>
        <no-warnings value="false"/>
        <duration-log.statistics value="true"/>
        <duration-log.disable value="false"/>
        <error-log value="sumo_errors.log"/>
    </report>

    <!-- ============================================================ -->
    <!-- EMISSIONS DEVICE                                             -->
    <!-- ============================================================ -->
    <emissions>
        <device.emissions.probability value="1.0"/>
    </emissions>

    <!-- ============================================================ -->
    <!-- OUTPUT FILES (paper statistics + dataset generation)         -->
    <!-- ============================================================ -->
    <output>
        <summary-output value="aljubail_dense_summary.xml"/>
        <tripinfo-output value="aljubail_dense_tripinfo.xml"/>
        <tripinfo-output.write-unfinished value="true"/>
        <statistic-output value="aljubail_dense_statistics.xml"/>
        <vehroute-output value="aljubail_dense_vehroutes.xml"/>
        <vehroute-output.write-unfinished value="true"/>
        <lanechange-output value="aljubail_dense_lanechanges.xml"/>
        <emission-output value="aljubail_dense_emissions.xml"/>
        <!-- Heavy outputs disabled by default; uncomment for deep analysis:
        <fcd-output value="aljubail_dense_fcd.xml"/>
        <netstate-dump value="aljubail_dense_netstate.xml"/>
        <netstate-dump.precision value="2"/>
        -->
    </output>

    <!-- ============================================================ -->
    <!-- GUI SETTINGS                                                 -->
    <!-- ============================================================ -->
    <gui_only>
        <gui-settings-file value="aljubail_saudi.gui.xml"/>
        <start value="true"/>
        <quit-on-end value="false"/>
        <window-size value="1920,1080"/>
        <window-pos value="50,50"/>
        <delay value="40"/>
    </gui_only>

    <!-- ============================================================ -->
    <!-- RANDOM NUMBER GENERATION (deterministic for paper figures)  -->
    <!-- ============================================================ -->
    <random_number>
        <!-- Fixed seed = reproducible screenshots and dataset.
             Set <random value="true"/> to randomize per run if you
             need Monte-Carlo variation across attack repetitions. -->
        <seed value="42"/>
        <random value="false"/>
    </random_number>

</configuration>
