<?xml version="1.0" encoding="UTF-8"?>
<!--
  VeReMiVNDN paper-1 dataset, JubST scenario, low density, seed 1.

  Generated by scripts/make_paper1_sumo_configs.sh. Two things vary across the
  fifteen files: <scale>, which sets the traffic density band the paper defines,
  and <seed>, which makes each seed replay a different mobility trace. The
  original configuration pinned seed 42 for reproducible screenshots, so every
  run drove identical trajectories and a seed axis varied nothing in mobility.

  Demand scaling was calibrated against this route file over a 300 s horizon:
  0.28 -> ~77 vehicles, 0.55 -> ~151, 1.30 -> ~356, spanning the paper's low
  (50-100), medium (100-200) and high (200-500) bands.

  The SUMO output section is omitted on purpose. Across 225 runs the tripinfo,
  vehroute, lanechange and emission writers produce tens of GB that no part of
  the analysis reads.
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="aljubail_saudi.net.xml"/>
        <route-files value="vTypes.add.xml,aljubail_saudi.rou.xml"/>
        <additional-files value="aljubail_saudi.poly.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="300"/>
        <step-length value="0.1"/>
    </time>
    <processing>
        <scale value="0.28"/>
        <collision.action value="warn"/>
        <time-to-teleport value="-1"/>
        <max-depart-delay value="300"/>
        <eager-insert value="true"/>
        <extrapolate-departpos value="true"/>
        <lateral-resolution value="0.8"/>
        <ignore-route-errors value="true"/>
    </processing>
    <routing>
        <device.rerouting.probability value="0.6"/>
        <device.rerouting.period value="30"/>
        <routing-algorithm value="dijkstra"/>
    </routing>
    <report>
        <no-step-log value="true"/>
        <no-warnings value="true"/>
    </report>
    <random_number>
        <seed value="1"/>
        <random value="false"/>
    </random_number>
</configuration>
