<?xml version="1.0" encoding="UTF-8"?>
<!--
    VeReMiVNDN - Enhanced Highway Scenario Configuration

    Highway environment with:
    - High-speed traffic (cars, trucks, buses, motorcycles)
    - Long-distance routes
    - Lane changes and overtaking
    - Emergency vehicles
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="aljubail_saudi.net.xml"/>
        <route-files value="vTypes.add.xml,highway_enhanced.rou.xml"/>
        <gui-settings-file value="highway_enhanced.gui.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <!-- Extended from 600 -> 2000 to match the paper's horizon. -->
        <end value="2000"/>
        <step-length value="0.1"/>
    </time>

    <processing>
        <collision.action value="warn"/>
        <collision.check-junctions value="true"/>
        <collision.mingap-factor value="1.0"/>
        <time-to-teleport value="-1"/>
        <!-- Allow teleport on highways after 120 s for stuck vehicles. -->
        <time-to-teleport.highways value="120"/>
        <max-depart-delay value="900"/>
        <eager-insert value="true"/>
        <extrapolate-departpos value="true"/>

        <!-- Highway-specific: higher lateral resolution for lane changes -->

        <!-- No pedestrians on highway -->
        <pedestrian.model value="nonInteracting"/>
    </processing>

    <routing>
        <!-- Highway rerouting: balanced (paper uses 0.6 globally). -->
        <device.rerouting.probability value="0.6"/>
        <device.rerouting.period value="30"/>
        <device.rerouting.adaptation-steps value="120"/>
        <device.rerouting.adaptation-interval value="15"/>
        <routing-algorithm value="dijkstra"/>
    </routing>

    <report>
        <verbose value="true"/>
        <no-step-log value="true"/>
        <no-warnings value="false"/>
        <duration-log.statistics value="true"/>
        <duration-log.disable value="false"/>
    </report>

    <emissions>
        <device.emissions.probability value="1.0"/>
    </emissions>

    <output>
        <summary-output value="highway_summary.xml"/>
        <tripinfo-output value="highway_tripinfo.xml"/>
        <tripinfo-output.write-unfinished value="true"/>
        <statistic-output value="highway_statistics.xml"/>
        <vehroute-output value="highway_vehroutes.xml"/>
        <vehroute-output.write-unfinished value="true"/>
        <lanechange-output value="highway_lanechanges.xml"/>
        <emission-output value="highway_emissions.xml"/>
    </output>

    <gui_only>
        <start value="true"/>
        <quit-on-end value="false"/>
        <window-size value="1920,1080"/>
        <delay value="40"/>
    </gui_only>

    <random_number>
        <seed value="56"/>
        <random value="false"/>
    </random_number>

</configuration>
