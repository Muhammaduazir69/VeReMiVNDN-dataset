<?xml version="1.0" encoding="UTF-8"?>
<!--
  VeReMiVNDN-EXE - JubST (Al-Jubail) baseline SUMO configuration.

  This is the default 300 s smoke-test scenario referenced from
  aljubail_saudi.launchd.xml. It uses the same JubST road network as the
  dense / extended runs, but with a shorter horizon for quick GUI demos
  and screenshot capture.

  Production-quality additions over the original 35-line minimal version:
    - vTypes.add.xml loaded (18 heterogeneous vehicle classes)
    - <output> section -> tripinfo / summary / statistics / lane-change /
      emission XML, ready to be plotted in the paper.
    - Sublane resolution 0.8 m for visible lane-change dynamics.
    - Eager insertion + extrapolated depart positions for smoother flow.
    - Adaptive rerouting (probability=0.6, period=30 s).
    - Fixed RNG seed for reproducible screenshots.

  The pre-upgrade version is preserved in aljubail_saudi.sumo.cfg.bak.
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="aljubail_saudi.net.xml"/>
        <!-- vTypes.add.xml MUST come first so vehicle types resolve. -->
        <route-files value="vTypes.add.xml,aljubail_saudi.rou.xml"/>
        <additional-files value="aljubail_saudi.poly.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="300"/>
        <step-length value="0.1"/>
    </time>

    <processing>
        <collision.action value="warn"/>
        <collision.check-junctions value="true"/>
        <collision.mingap-factor value="1.0"/>
        <time-to-teleport value="-1"/>
        <time-to-teleport.highways value="120"/>
        <max-depart-delay value="300"/>
        <eager-insert value="true"/>
        <extrapolate-departpos value="true"/>
        <lateral-resolution value="0.8"/>
        <pedestrian.model value="striping"/>
        <pedestrian.striping.stripe-width value="0.65"/>
        <pedestrian.striping.dawdling value="0.2"/>
        <ignore-route-errors value="true"/>
    </processing>

    <routing>
        <device.rerouting.probability value="0.6"/>
        <device.rerouting.period value="30"/>
        <device.rerouting.adaptation-steps value="180"/>
        <device.rerouting.adaptation-interval value="10"/>
        <routing-algorithm value="dijkstra"/>
    </routing>

    <report>
        <verbose value="true"/>
        <no-step-log value="true"/>
        <no-warnings value="false"/>
        <duration-log.statistics value="true"/>
    </report>

    <emissions>
        <device.emissions.probability value="1.0"/>
    </emissions>

    <output>
        <summary-output value="aljubail_summary.xml"/>
        <tripinfo-output value="aljubail_tripinfo.xml"/>
        <tripinfo-output.write-unfinished value="true"/>
        <statistic-output value="aljubail_statistics.xml"/>
        <vehroute-output value="aljubail_vehroutes.xml"/>
        <vehroute-output.write-unfinished value="true"/>
        <lanechange-output value="aljubail_lanechanges.xml"/>
        <!-- Emission output disabled by default; uncomment if needed:
        <emission-output value="aljubail_emissions.xml"/> -->
    </output>

    <gui_only>
        <gui-settings-file value="aljubail_saudi.gui.xml"/>
        <start value="true"/>
        <quit-on-end value="false"/>
        <window-size value="1920,1080"/>
        <delay value="40"/>
    </gui_only>

    <random_number>
        <seed value="42"/>
        <random value="false"/>
    </random_number>

</configuration>
